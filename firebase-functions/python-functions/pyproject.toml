[project]
name = "python-functions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cioos-metadata-conversion",
    "firebase-functions>=0.4.3",
    "setuptools<81",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.2",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.uv.sources]
cioos-metadata-conversion = { git = "https://github.com/cioos-siooc/cioos-metadata-conversion.git", branch = "fix/datacite-schema" }
