[project]
name = "cioos-metadata-converter"
version = "0.1.0"
description = "Metadata conversion service: record JSON -> XML/YAML/JSON/ERDDAP, plus WAF file management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Installed from GitHub tarballs (not git+https) so the image builds without a
    # `git` binary — dropping the slow `apt-get install git` step. cioos-metadata-
    # conversion requires metadata-xml but doesn't expose a pip-resolvable source for
    # it, so we declare metadata-xml explicitly here.
    "metadata-xml @ https://github.com/cioos-siooc/metadata-xml/archive/refs/heads/master.tar.gz",
    "cioos-metadata-conversion @ https://github.com/cioos-siooc/cioos-metadata-conversion/archive/refs/heads/fix/datacite-schema.tar.gz",
]

[build-system]
requires = ["setuptools<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["converter"]
