server {
    listen 80;
    server_name localhost;

    # Ask search engines not to index or follow anything served here
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Block all crawlers from indexing the WAF
    location = /robots.txt {
        default_type text/plain;
        return 200 "# This server is not meant to be crawled or harvested.\n# All user agents are disallowed from accessing any content.\nUser-agent: *\nDisallow: /\n";
    }

    location / {
        alias /usr/share/nginx/html/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime off;
        index index.html;
        add_before_body /files/header.txt;
        add_after_body /files/footer.txt;
        charset utf-8;
        types {
            text/plain yaml;
            text/xml xml;
        }
    }
} 