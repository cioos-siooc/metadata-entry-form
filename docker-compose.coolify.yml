# Coolify deployment (Docker Compose build pack) for the CIOOS metadata entry form.
#
# Point a Coolify resource at this file. Coolify builds the app services from git,
# injects its own reverse proxy, and — with Preview Deployments enabled — spins up an
# isolated copy per pull request at a generated URL, torn down when the PR closes.
#
# Only `web` is exposed: it serves the SPA and reverse-proxies /api, so
# postgres/api/converter stay private on the Docker network. Do NOT add
# `ports:` to any service — that bypasses Coolify's proxy and collides across previews.
#
# Authentication is handled by the API itself (local email+password + OAuth to
# Google/Microsoft/ORCID under /api/v1/auth) — there is no Keycloak container.
#
# Magic variables (auto-generated by Coolify, unique per preview):
#   SERVICE_FQDN_WEB=/          -> exposes web at the generated FQDN (port 80)
#   ${SERVICE_URL_WEB}          -> full https URL, reused for the API hostname
#   ${SERVICE_PASSWORD_POSTGRES} -> generated secret
#
# Set these in the Coolify UI (Environment Variables):
#   CREDENTIALS_ENC_KEY  (64 hex chars: `openssl rand -hex 32`)
#   JWT_PRIVATE_KEY, JWT_PUBLIC_KEY  (RS256: `openssl genrsa -out k 2048`,
#                                     `openssl rsa -in k -pubout -out k.pub`;
#                                     set as base64 — `base64 -w0 k` — to avoid
#                                     newline mangling in the Coolify UI)
#   OAUTH_GOOGLE_CLIENT_ID/_SECRET, OAUTH_MICROSOFT_CLIENT_ID/_SECRET,
#   OAUTH_ORCID_CLIENT_ID/_SECRET   (register the callback
#       ${SERVICE_URL_WEB}/api/v1/auth/oauth/<provider>/callback with each provider)
#   COHERE_API_KEY, GITHUB_AUTH, SMTP_HOST/PORT/SECURE/USER/PASS/FROM
#   GITHUB_TOKEN         (optional build arg; avoids GitHub rate limits at build time)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cioos_metadata
      POSTGRES_USER: cioos
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cioos:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/cioos_metadata
      # The API signs its own tokens; issuer + OAuth redirects use the public URL.
      AUTH_ISSUER: ${SERVICE_URL_WEB}
      SPA_URL: ${SERVICE_URL_WEB}
      API_URL: ${SERVICE_URL_WEB}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      # OAuth clients (register each callback URL with the provider; see header).
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET}
      OAUTH_MICROSOFT_DISCOVERY_URL: ${OAUTH_MICROSOFT_DISCOVERY_URL:-https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration}
      OAUTH_ORCID_CLIENT_ID: ${OAUTH_ORCID_CLIENT_ID}
      OAUTH_ORCID_CLIENT_SECRET: ${OAUTH_ORCID_CLIENT_SECRET}
      CONVERTER_URL: http://converter:8000
      CREDENTIALS_ENC_KEY: ${CREDENTIALS_ENC_KEY}
      # admin@example.org becomes a full superadmin in the preview.
      SUPERADMIN_EMAILS: admin@example.org
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      COHERE_API_KEY: ${COHERE_API_KEY}
      GITHUB_AUTH: ${GITHUB_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Runs DB migrations before listening; give it room to boot.
      start_period: 60s

  converter:
    build: ./converter
    restart: unless-stopped
    volumes:
      - waf_files:/data/waf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        # Optional: raise GitHub API rate limits during the prebuild release fetch.
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        # Show the "Sign in with local account" button so dev-realm users can log in.
        # Hardcoded (not ${...}) so it doesn't depend on a Coolify env var being
        # marked build-time — the value is baked straight into the build.
        VITE_AUTH_LOCAL: "true"
    restart: unless-stopped
    environment:
      # Exposes web at Coolify's generated per-preview FQDN (nginx listens on :80).
      # The SPA talks to /api same-origin, so no VITE_* build args are needed.
      SERVICE_FQDN_WEB: /
    depends_on:
      - api

volumes:
  pgdata:
  waf_files:
