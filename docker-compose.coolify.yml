# Coolify deployment (Docker Compose build pack) for the CIOOS metadata entry form.
#
# Point a Coolify resource at this file. Coolify builds the app services from git,
# injects its own reverse proxy, and — with Preview Deployments enabled — spins up an
# isolated copy per pull request at a generated URL, torn down when the PR closes.
#
# Only `web` is exposed: it serves the SPA and reverse-proxies /api and /auth, so
# postgres/keycloak/api/converter stay private on the Docker network. Do NOT add
# `ports:` to any service — that bypasses Coolify's proxy and collides across previews.
#
# Magic variables (auto-generated by Coolify, unique per preview):
#   SERVICE_FQDN_WEB=/          -> exposes web at the generated FQDN (port 80)
#   ${SERVICE_URL_WEB}          -> full https URL, reused for Keycloak/API hostnames
#   ${SERVICE_PASSWORD_POSTGRES}, ${SERVICE_PASSWORD_KCADMIN} -> generated secrets
#
# Set these in the Coolify UI (Environment Variables):
#   CREDENTIALS_ENC_KEY  (64 hex chars: `openssl rand -hex 32`)
#   COHERE_API_KEY, GITHUB_AUTH, SMTP_HOST/PORT/SECURE/USER/PASS/FROM
#   GITHUB_TOKEN         (optional build arg; avoids GitHub rate limits at build time)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cioos_metadata
      POSTGRES_USER: cioos
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the separate `keycloak` database idempotently on every deploy. Replaces
  # the first-boot-only postgres-init script, which doesn't run when the pgdata volume
  # already exists or when the repo bind mount isn't honored (e.g. on Coolify).
  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -U cioos -d cioos_metadata -tc "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1 || psql -h postgres -U cioos -d cioos_metadata -c "CREATE DATABASE keycloak OWNER cioos"

  keycloak:
    # Built from ./keycloak/Dockerfile so the dev realm is baked into the image
    # (Coolify doesn't honor the ./keycloak/dev bind mount used by the plain stack).
    build: ./keycloak
    restart: unless-stopped
    command: start --import-realm --http-relative-path /auth --proxy-headers xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: cioos
      KC_DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Keycloak must know its externally-visible URL; Coolify generates it per preview.
      KC_HOSTNAME: ${SERVICE_URL_WEB}/auth
      # The dev realm's client redirectUris use ${env.PUBLIC_URL}/* — this makes that
      # placeholder resolve to the preview origin at realm-import time so login redirects
      # back to the SPA instead of failing with "Invalid parameter: redirect_uri".
      PUBLIC_URL: ${SERVICE_URL_WEB}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_KCADMIN}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      # First production start does an auto-build + realm import, which is slow on a
      # loaded build host. start_period keeps those early failures from marking the
      # container unhealthy (and Coolify aborting the deploy) before it finishes booting.
      start_period: 120s

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cioos:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/cioos_metadata
      # External issuer (token validation) must match the browser-facing URL;
      # internal issuer is used for server-to-Keycloak calls on the Docker network.
      KEYCLOAK_ISSUER: ${SERVICE_URL_WEB}/auth/realms/cioos
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/cioos
      KEYCLOAK_AUDIENCE: metadata-form
      CONVERTER_URL: http://converter:8000
      CREDENTIALS_ENC_KEY: ${CREDENTIALS_ENC_KEY}
      # dev-admin (admin@example.org) becomes a full superadmin in the preview.
      SUPERADMIN_EMAILS: admin@example.org
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      COHERE_API_KEY: ${COHERE_API_KEY}
      GITHUB_AUTH: ${GITHUB_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Waits on keycloak + runs DB migrations before listening; give it room to boot.
      start_period: 60s

  converter:
    build: ./converter
    restart: unless-stopped
    volumes:
      - waf_files:/data/waf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        # Optional: raise GitHub API rate limits during the prebuild release fetch.
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        # Show the "Sign in with local account" button so dev-realm users can log in.
        # Hardcoded (not ${...}) so it doesn't depend on a Coolify env var being
        # marked build-time — the value is baked straight into the build.
        VITE_AUTH_LOCAL: "true"
    restart: unless-stopped
    environment:
      # Exposes web at Coolify's generated per-preview FQDN (nginx listens on :80).
      # The SPA talks to /api and /auth same-origin, so no VITE_* build args are needed.
      SERVICE_FQDN_WEB: /
    depends_on:
      - api
      - keycloak

volumes:
  pgdata:
  waf_files:
