# Pre-commit hooks for the metadata-entry-form repo.
# Install once with:  pre-commit install
# Run on everything:  pre-commit run --all-files
#
# Python is handled by ruff; JS/JSON/CSS/Markdown/YAML by the project's own
# eslint + prettier (via lint-staged, so versions stay pinned to package.json).

default_install_hook_types: [pre-commit]

repos:
  # --- Python: ruff lint + format ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- JavaScript / Prettier-managed files, via lint-staged ---
  - repo: local
    hooks:
      - id: lint-staged
        name: eslint + prettier (lint-staged)
        entry: npx lint-staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Generated at build time; leave it alone.
        exclude: ^src/data/githubReleases\.json$
      - id: end-of-file-fixer
        exclude: ^src/data/githubReleases\.json$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
