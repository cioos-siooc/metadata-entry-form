name: Run Build and Tests
on:
  push:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test
        env:
          CI: true

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cioos_metadata
          POSTGRES_USER: cioos
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cioos -d cioos_metadata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Run migrations
        run: npx node-pg-migrate --migrations-dir migrations --migration-file-language sql up
        working-directory: server
        env:
          DATABASE_URL: postgres://cioos:devpassword@localhost:5433/cioos_metadata
      - name: Run server tests
        run: npx jest
        working-directory: server
        env:
          CI: true
          DATABASE_URL: postgres://cioos:devpassword@localhost:5433/cioos_metadata

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install fastapi httpx pytest
        working-directory: converter
      - name: Run converter tests
        run: python -m pytest test_main.py
        working-directory: converter
