name: Auto-label and Require Label

on:
  pull_request:
    branches: [development]
    types: [opened, labeled, unlabeled, synchronize]

permissions:
  pull-requests: write

jobs:
  auto-label-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label PR based on branch name
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // Skip auto-labeling if PR already has labels
            if (pr.labels.length > 0) {
              core.info(`PR already has ${pr.labels.length} label(s). Skipping auto-label.`);
              return;
            }

            const prefixToLabel = {
              'feature/': 'enhancement',
              'enhancement/': 'enhancement',
              'feat/': 'enhancement',
              'bug/': 'bug',
              'fix/': 'bug',
              'hotfix/': 'hotfix',
              'refactor/': 'refactor',
              'chore/': 'chore',
              'docs/': 'documentation',
              'documentation/': 'documentation',
              'test/': 'test',
              'style/': 'style',
              'perf/': 'performance',
              'performance/': 'performance',
              'build/': 'build',
              'revert/': 'revert',
            };

            for (const [prefix, label] of Object.entries(prefixToLabel)) {
              if (branch.startsWith(prefix)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [label],
                });
                core.info(`Applied label "${label}" based on branch prefix "${prefix}"`);
                return;
              }
            }
            core.warning(`No matching prefix found for branch "${branch}". Label manually.`);

      - name: Check for at least one label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.labels.length === 0) {
              core.setFailed(
                'This PR must have at least one label before merging. ' +
                'Use a branch prefix (e.g., feature/, fix/, docs/) or add a label manually.'
              );
            } else {
              core.info(`PR has ${pr.labels.length} label(s). ✓`);
            }
