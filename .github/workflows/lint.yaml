name: Lint

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "**/*.{js,jsx,json,css,md,yaml,yml,html}"

  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.4
      - run: ruff check .
      - run: ruff format --check .
