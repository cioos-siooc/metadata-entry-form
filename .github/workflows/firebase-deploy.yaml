name: Deploy firebase functions
on:
  push:
    branches:
      - development
    paths:
      - "firebase-functions/**"
    tags:
      - 'v*'
  pull_request:
    paths:
      - "firebase-functions/**"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy to production (e.g. v1.2.3)'
        required: true
        type: string
      skip_cross_trigger:
        description: 'Skip triggering the other deployment workflow (prevents loops)'
        required: false
        default: 'false'
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Check if user is repo admin
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_cross_trigger != 'true'
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission' 2>/dev/null || echo "none")
          if [ "$PERMISSION" != "admin" ]; then
            echo "Error: Only repository admins can trigger manual deployments"
            echo "User '${{ github.actor }}' has '$PERMISSION' permission, not 'admin'"
            exit 1
          fi
          echo "User '${{ github.actor }}' verified as repo admin"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags
          if ! git rev-parse "${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "Tag '${{ github.event.inputs.tag }}' does not exist"
            exit 1
          fi
          echo "Tag '${{ github.event.inputs.tag }}' found"
      - name: Set up Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: Install Dependencies
        run: npm ci
        working-directory: firebase-functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install Dependencies
        run: npm ci
        working-directory: firebase-functions/functions
      - name: Install UV 
        uses: astral-sh/setup-uv@v6
      - name: Install Python environment in venv
        working-directory: firebase-functions/python-functions
        run: |
          uv venv venv --clear
          uv export --format requirements-txt --no-dev --no-hashes --output-file requirements.txt
          source venv/bin/activate
          uv pip install -r requirements.txt
      - name: Authenticate Firebase and Deploy
        run: |
          echo "Creating .env file..."
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" >> .env
          echo "GMAIL_PASS=${{ secrets.GMAIL_PASS }}" >> .env
          echo "DATACITE_AUTH_HASH=${{ secrets.DATACITE_AUTH_HASH }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_ACCESSKEYID=${{ secrets.AWS_ACCESSKEYID }}" >> .env
          echo "AWS_SECRETACCESSKEY=${{ secrets.AWS_SECRETACCESSKEY }}" >> .env
          echo "GITHUB_AUTH=${{ secrets.ISSUE_CREATOR_PAT }}" >> .env
          echo "VITE_GOOGLE_CLOUD_API_KEY=${{ secrets.REACT_APP_GOOGLE_CLOUD_API_KEY }}" >> .env
          echo "VITE_GOOGLE_CLOUD_API_KEY_DEV=${{ secrets.REACT_APP_GOOGLE_CLOUD_API_KEY_DEV }}" >> .env
          echo "Selecting Firebase project based on event type..."
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Deploying to production"
            echo "VITE_DEV_DEPLOYMENT=false" >> .env
            firebase use default
          else
            echo "On dev branch or PR, deploying to dev"
            echo "VITE_DEV_DEPLOYMENT=true" >> .env
            firebase use dev
          fi
          cp .env ../python-functions/.env
          echo "Deploying to Firebase..."
          firebase deploy --only functions:js-functions,functions:py-functions --token ${{ secrets.FIREBASE_TOKEN }} --force
        working-directory: firebase-functions/functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          DATACITE_AUTH_HASH: ${{ secrets.DATACITE_AUTH_HASH }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESSKEYID: ${{ secrets.AWS_ACCESSKEYID }}
          AWS_SECRETACCESSKEY: ${{ secrets.AWS_SECRETACCESSKEY }}
          GITHUB_AUTH: ${{ secrets.ISSUE_CREATOR_PAT }}
          VITE_GOOGLE_CLOUD_API_KEY: ${{ secrets.REACT_APP_GOOGLE_CLOUD_API_KEY }}
          VITE_GOOGLE_CLOUD_API_KEY_DEV: ${{ secrets.REACT_APP_GOOGLE_CLOUD_API_KEY_DEV }}
          PROJECT_PATH: ./firebase-functions
      - name: Trigger GitHub Pages deployment
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_cross_trigger != 'true'
        run: |
          gh workflow run github-pages-deploy.yaml \
            --field tag=${{ github.event.inputs.tag }} \
            --field skip_cross_trigger=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
