name: Close PR delete firebase channel
on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

jobs:
  delete_firebase_channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - id: get-short-name
        run: |
          id=$(echo ${{github.event.pull_request.head.ref}} | cut -c 1-20)
          echo "id=$id" >> $GITHUB_OUTPUT
      - name: Delete Preview Channel on Firebase
        uses: w9jds/firebase-action@v15.34.1
        with:
          args: hosting:channel:delete pr${{github.event.number}}-${{steps.get-short-name.outputs.id}} --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: cioos-metadata-form-dev-258dc
          GITHUB_AUTH: ${{ secrets.ISSUE_CREATOR_PAT }}
      - name: Deactivate GitHub Deployment Environment
        uses: actions/github-script@v9
        with:
          script: |
            const number = context.payload.pull_request.number;
            // All PRs share the "preview" environment; pick this PR's deployments
            // by the description set in firebase-hosting-pull-request.yml.
            const shared = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'preview',
              per_page: 100,
            });
            // PRs deployed before the shared environment used preview-pr-<number>.
            const legacy = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `preview-pr-${number}`,
              per_page: 100,
            });
            const deployments = [
              ...shared.filter((d) => d.description === `Preview deployment for PR #${number}`),
              ...legacy,
            ];
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'PR closed, preview environment destroyed',
              });
            }
